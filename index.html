<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#cfc0ff">
  <title>wizzy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #cbb9ff;
      --bg-glow-1: #dfd3ff;
      --bg-glow-2: #b9a1ff;
      --bg-glow-3: #e8dfff;

      --glass-bg: rgba(255, 255, 255, 0.32);
      --glass-bg-hover: rgba(255, 255, 255, 0.52);
      --glass-border: rgba(255, 255, 255, 0.55);
      --glass-shadow: 0 8px 32px rgba(93, 63, 180, 0.12);
      --glass-shadow-hover: 0 14px 36px rgba(93, 63, 180, 0.18);

      --text-main: #3b2a6e;
      --text-footer: #efe9ff;
      --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: 1fr auto;
      place-items: center;
      padding: clamp(1.25rem, 4vw, 2.5rem);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-base);
      background-image:
        radial-gradient(at 15% 15%, var(--bg-glow-1) 0px, transparent 55%),
        radial-gradient(at 85% 20%, var(--bg-glow-3) 0px, transparent 50%),
        radial-gradient(at 50% 90%, var(--bg-glow-2) 0px, transparent 60%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Subtelna tekstura ziarna dla głębi tła */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    main {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      z-index: 1;
    }

    .link-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 1.05rem 1.35rem;
      text-decoration: none;
      color: var(--text-main);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      box-shadow: var(--glass-shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition:
        transform 0.3s var(--ease-spring),
        background-color 0.25s ease,
        box-shadow 0.3s var(--ease-spring),
        border-color 0.25s ease;
      -webkit-tap-highlight-color: transparent;

      & .btn-left {
        display: flex;
        align-items: center;
        gap: 0.85rem;
      }

      & .icon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        opacity: 0.85;
      }

      & .arrow {
        width: 18px;
        height: 18px;
        opacity: 0.45;
        transition: transform 0.3s var(--ease-spring), opacity 0.25s ease;
      }

      &:active {
        transform: scale(0.975);
      }

      &:focus-visible {
        outline: 2px solid var(--text-main);
        outline-offset: 3px;
      }
    }

    @media (hover: hover) {
      .link-btn:hover {
        transform: translateY(-3px);
        background: var(--glass-bg-hover);
        box-shadow: var(--glass-shadow-hover);
        border-color: rgba(255, 255, 255, 0.8);

        & .arrow {
          opacity: 0.9;
          transform: translate(2px, -2px);
        }
      }
    }

    footer {
      z-index: 1;
      padding-top: 1.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--text-footer);
      user-select: none;
    }

    @media (min-width: 768px) {
      main {
        max-width: 400px;
        gap: 1rem;
      }

      .link-btn {
        padding: 1.15rem 1.5rem;
        font-size: 1.05rem;
      }
    }
  </style>
</head>
<body>

        <path d="M7 17 17 7M7 7h10v10"/>

    </a>
  </main>

  <footer>come stai</footer>
</body>
</html>
