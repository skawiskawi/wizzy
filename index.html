<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#cbb9ff">
  <title>wizzy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600&display=swap" rel="stylesheet">
  <script>
    (() => {
      const saved = localStorage.getItem('wizzy-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#251e35' : '#cbb9ff');
    })();
  </script>
  <style>
    :root {
      --bg-fallback: #cbb9ff;
      --glass-bg: rgba(255, 255, 255, 0.34);
      --glass-bg-hover: rgba(255, 255, 255, 0.54);
      --glass-border: rgba(255, 255, 255, 0.58);
      --glass-border-hover: rgba(255, 255, 255, 0.88);
      --glass-shadow: 0 8px 32px rgba(93, 55, 168, 0.12);
      --glass-shadow-hover: 0 14px 36px rgba(93, 55, 168, 0.18);
      --text-main: #3b2466;
      --text-footer: #f2ecff;
      --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
    }

    :root[data-theme="dark"] {
      --bg-fallback: #251e35;
      --glass-bg: rgba(37, 30, 53, 0.42);
      --glass-bg-hover: rgba(58, 46, 84, 0.58);
      --glass-border: rgba(212, 194, 255, 0.22);
      --glass-border-hover: rgba(226, 212, 255, 0.45);
      --glass-shadow: 0 8px 32px rgba(15, 10, 26, 0.38);
      --glass-shadow-hover: 0 14px 36px rgba(15, 10, 26, 0.52);
      --text-main: #f0e8ff;
      --text-footer: #c7b5eb;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: 1fr auto;
      place-items: center;
      padding: clamp(1.25rem, 4vw, 2.5rem);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-fallback);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      transition: color 0.4s ease, background-color 0.4s ease;
    }

    #granim-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Subtelna tekstura ziarna eliminująca banding gradientu */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .theme-toggle {
      position: fixed;
      top: clamp(1rem, 3.5vw, 1.75rem);
      right: clamp(1rem, 3.5vw, 1.75rem);
      z-index: 10;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      color: var(--text-main);
      box-shadow: var(--glass-shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition:
        transform 0.3s var(--ease-spring),
        background-color 0.25s ease,
        border-color 0.25s ease,
        color 0.25s ease;

      & svg {
        width: 20px;
        height: 20px;
      }

      & .icon-sun {
        display: none;
      }

      &:active {
        transform: scale(0.92);
      }

      &:focus-visible {
        outline: 2px solid var(--text-main);
        outline-offset: 3px;
      }
    }

    :root[data-theme="dark"] .theme-toggle {
      & .icon-moon {
        display: none;
      }

      & .icon-sun {
        display: block;
      }
    }

    @media (hover: hover) {
      .theme-toggle:hover {
        transform: translateY(-2px);
        background: var(--glass-bg-hover);
        border-color: var(--glass-border-hover);
      }
    }

    main {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .link-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 1.05rem 1.35rem;
      text-decoration: none;
      color: var(--text-main);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      box-shadow: var(--glass-shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition:
        transform 0.3s var(--ease-spring),
        background-color 0.25s ease,
        box-shadow 0.3s var(--ease-spring),
        border-color 0.25s ease,
        color 0.25s ease;
      -webkit-tap-highlight-color: transparent;

      & .btn-left {
        display: flex;
        align-items: center;
        gap: 0.85rem;
      }

      & .icon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        opacity: 0.85;
      }

      & .arrow {
        width: 18px;
        height: 18px;
        opacity: 0.45;
        transition: transform 0.3s var(--ease-spring), opacity 0.25s ease;
      }

      &:active {
        transform: scale(0.975);
      }

      &:focus-visible {
        outline: 2px solid var(--text-main);
        outline-offset: 3px;
      }
    }

    @media (hover: hover) {
      .link-btn:hover {
        transform: translateY(-3px);
        background: var(--glass-bg-hover);
        box-shadow: var(--glass-shadow-hover);
        border-color: var(--glass-border-hover);

        & .arrow {
          opacity: 0.9;
          transform: translate(2px, -2px);
        }
      }
    }

    footer {
      position: relative;
      z-index: 2;
      padding-top: 1.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--text-footer);
      user-select: none;
      transition: color 0.35s ease;
    }

    @media (min-width: 768px) {
      main {
        max-width: 400px;
        gap: 1rem;
      }

      .link-btn {
        padding: 1.15rem 1.5rem;
        font-size: 1.05rem;
      }
    }
  </style>
</head>
<body>
  <canvas id="granim-canvas" aria-hidden="true"></canvas>

  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Przełącz tryb jasny/ciemny">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
    </svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
    </svg>
  </button>

  <main aria-label="Linki">
    <a class="link-btn" href="#" target="_blank" rel="noopener noreferrer">
      <span class="btn-left">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2Z"/>
        </svg>
        <span>github</span>
      </span>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M7 17 17 7M7 7h10v10"/>
      </svg>
    </a>

    <a class="link-btn" href="#" target="_blank" rel="noopener noreferrer">
      <span class="btn-left">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 20V10M12 20V4M6 20v-6"/>
        </svg>
        <span>stats.fm</span>
      </span>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M7 17 17 7M7 7h10v10"/>
      </svg>
    </a>

    <a class="link-btn" href="#" target="_blank" rel="noopener noreferrer">
      <span class="btn-left">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>
        </svg>
        <span>fortnite tracker</span>
      </span>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M7 17 17 7M7 7h10v10"/>
      </svg>
    </a>
  </main>

  <footer>come stai</footer>

  <script src="https://cdn.jsdelivr.net/npm/granim@2.0.0/dist/granim.min.js"></script>
  <script type="module">
    const THEME_KEY = 'wizzy-theme';
    const root = document.documentElement;
    const toggleBtn = document.getElementById('theme-toggle');
    const metaTheme = document.querySelector('meta[name="theme-color"]');

    const currentTheme = root.dataset.theme || 'light';

    const granimInstance = new window.Granim({
      element: '#granim-canvas',
      direction: 'left-right',
      isPausedWhenNotInView: true,
      defaultStateName: currentTheme === 'dark' ? 'dark-state' : 'light-state',
      stateTransitionSpeed: 500,
      states: {
        'light-state': {
          gradients: [
            ['#ede4ff', '#cbb9ff', '#b294ff'],
            ['#b294ff', '#dfd1ff', '#f3ecff'],
            ['#d5c2ff', '#a786ff', '#e7dbff']
          ],
          transitionSpeed: 2800
        },
        'dark-state': {
          gradients: [
            ['#251e35', '#433361', '#6b5294'],
            ['#5c4582', '#2c2340', '#7d62ab'],
            ['#382b52', '#70569c', '#211a30']
          ],
          transitionSpeed: 2800
        }
      }
    });

    const applyTheme = (theme, persist = false) => {
      root.dataset.theme = theme;
      if (persist) localStorage.setItem(THEME_KEY, theme);
      if (metaTheme) metaTheme.setAttribute('content', theme === 'dark' ? '#251e35' : '#cbb9ff');
      granimInstance.changeState(theme === 'dark' ? 'dark-state' : 'light-state');
    };

    toggleBtn.addEventListener('click', () => {
      const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      applyTheme(next, true);
    });

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      if (!localStorage.getItem(THEME_KEY)) {
        applyTheme(e.matches ? 'dark' : 'light', false);
      }
    });
  </script>
</body>
</html>
