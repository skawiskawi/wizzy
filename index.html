  <script>
    (() => {
      const saved = localStorage.getItem('wizzy-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved === 'dark' || saved === 'light' ? saved : (prefersDark ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#1c1429' : '#cbb9ff');
    })();
  </script>

  <script type="module">
    const THEME_KEY = 'wizzy-theme';
    const root = document.documentElement;
    const toggleBtn = document.getElementById('theme-toggle');
    const metaTheme = document.querySelector('meta[name="theme-color"]');
    const canvas = document.getElementById('gradient');

    const PALETTES = {
      light: {
        meta: '#cbb9ff',
        colors: [
          { color: '#cbb9ff', enabled: true },
          { color: '#f1eaff', enabled: true },
          { color: '#9c73ff', enabled: true },
          { color: '#dfd0ff', enabled: true },
          { color: '#b490ff', enabled: true }
        ]
      },
      dark: {
        meta: '#1c1429',
        colors: [
          { color: '#1c1429', enabled: true },
          { color: '#422c66', enabled: true },
          { color: '#784eb8', enabled: true },
          { color: '#271a3d', enabled: true },
          { color: '#593b8a', enabled: true }
        ]
      }
    };

    let neat = null;

    const getActiveTheme = () => (root.dataset.theme === 'dark' ? 'dark' : 'light');

    const applyTheme = (theme, persist = false) => {
      const normalized = theme === 'dark' ? 'dark' : 'light';
      root.dataset.theme = normalized;
      if (persist) {
        try {
          localStorage.setItem(THEME_KEY, normalized);
        } catch {}
      }
      const palette = PALETTES[normalized];
      if (metaTheme) metaTheme.setAttribute('content', palette.meta);
      if (neat) {
        neat.colors = palette.colors;
        neat.backgroundColor = palette.meta;
      }
    };

    toggleBtn?.addEventListener('click', (event) => {
      event.preventDefault();
      const next = getActiveTheme() === 'dark' ? 'light' : 'dark';
      applyTheme(next, true);
    });

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      let hasSaved = false;
      try {
        hasSaved = Boolean(localStorage.getItem(THEME_KEY));
      } catch {}
      if (!hasSaved) {
        applyTheme(e.matches ? 'dark' : 'light', false);
      }
    });

    try {
      const { NeatGradient } = await import('https://esm.sh/@firecms/neat@0.3.3');
      const initial = getActiveTheme();
      neat = new NeatGradient({
        ref: canvas,
        colors: PALETTES[initial].colors,
        speed: 8,
        horizontalPressure: 5,
        verticalPressure: 6,
        waveFrequencyX: 3,
        waveFrequencyY: 4,
        waveAmplitude: 8,
        shadows: 5,
        highlights: 6,
        colorBrightness: 1,
        colorSaturation: 2.2,
        wireframe: false,
        colorBlending: 8,
        backgroundColor: PALETTES[initial].meta,
        backgroundAlpha: 1,
        grainScale: 2,
        grainSparsity: 0,
        grainIntensity: 0.08,
        grainSpeed: 1,
        resolution: 1
      });
    } catch {
      neat = null;
    }
  </script>
